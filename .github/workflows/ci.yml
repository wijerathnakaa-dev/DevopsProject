name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - API integration tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PORT: 5000
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_NAME: tea_herbal_db
      JWT_SECRET: ci_only_jwt_secret_not_used_anywhere_else

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create and seed database
        run: npm run init-db

      - name: Start API server
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && exit 0
            sleep 1
          done
          echo "API did not become healthy"; cat server.log; exit 1

      - name: Run API tests
        run: npm test

      - name: Show server log on failure
        if: failure()
        run: cat server.log || true

  frontend:
    name: Frontend - lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker - build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Create CI environment file
        run: |
          cat > .env <<'ENV'
          MYSQL_ROOT_PASSWORD=ci_root_password
          DB_NAME=tea_herbal_db
          DB_USER=chaceylon_app
          DB_PASSWORD=ci_app_password
          JWT_SECRET=ci_only_jwt_secret_not_used_anywhere_else
          ENV

      - name: Build and start the full stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Smoke test through Nginx
        run: |
          curl -sf http://localhost/api/health
          curl -sf http://localhost/api/products | head -c 300

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
