version: '3.8'

services:
  # MySQL Database Service
  database:
    image: mysql:8.0
    container_name: chaceylon-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tea_herbal_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - chaceylon-network

  # Express REST API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chaceylon-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: tea_herbal_db
      JWT_SECRET: super_secret_jwt_key_chaceylon_2026_devops
    depends_on:
      - database
    networks:
      - chaceylon-network

  # React Frontend (Nginx) Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chaceylon-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - chaceylon-network

networks:
  chaceylon-network:
    driver: bridge

volumes:
  mysql_data:
